<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPPO An Giang | Sale & KPI</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="data.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#14253a;font:15px system-ui,Arial,sans-serif}header,nav{background:#087759;color:white}header>div,nav>div,main{max-width:1400px;margin:auto;padding:20px 24px}header>div{display:flex;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:23px;margin:0}small{color:#64748b}header small{color:#c5f5e5}header .actions{margin-left:auto}button,label.upload{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:600;background:#e9f0f5;color:#155b4a;display:inline-block}header button,header label{background:white}nav{background:#08634f}nav>div{display:flex;padding:0 24px;gap:20px;overflow:auto}nav button{white-space:nowrap;background:none;color:#b9e8d9;border-radius:0;padding:16px 0;border-bottom:3px solid transparent}nav button.active{color:white;border-color:white}.panel,.tile{background:white;border:1px solid #dce4eb;border-radius:15px;padding:22px;box-shadow:0 2px 4px #00000006}.notice{background:#fff8e4;border:1px solid #ead39b;border-radius:12px;padding:15px;margin-bottom:20px;color:#85500a}.hero{background:linear-gradient(120deg,#06936f,#10776f);color:white;border-radius:17px;padding:26px;flex:2}.hero small{color:#d0f9eb}.flex{display:flex;gap:20px;flex-wrap:wrap}.flex>.panel{flex:1;min-width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:17px;margin-top:20px}.big{font-size:44px;font-weight:750}.score{font-size:28px;font-weight:700}.bar{height:9px;background:#eaf0f4;border-radius:10px;overflow:hidden;margin:18px 0 8px}.hero .bar{background:#096859}.bar i{display:block;height:100%;background:#0ba782;border-radius:10px}.hero .bar i{background:#b6f5d9}.tile .pct{float:right;background:#eef3f7;border-radius:20px;padding:4px 10px;font-size:13px}.tile h3{font-size:14px;color:#536d82;margin:18px 0 8px}.tile .symbol{font-size:24px;color:#088c6b}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:13px 0}input,select{padding:9px;border:1px solid #cad6e1;border-radius:7px;background:white;color:#172c40;font:inherit}input[type=number]{width:90px;text-align:right}h2{font-size:18px;margin:0 0 12px}.scroll{overflow:auto;max-height:600px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf2;white-space:nowrap}th{background:#edf2f7;position:sticky;top:0}td:last-child{font-weight:650}footer{padding:22px;text-align:center;color:#64748b;font-size:12px}.muted{color:#64748b}.warn{color:#a35c00} .green{color:#00866a}@media(max-width:650px){header>div,main{padding:15px}h1{font-size:18px}.hero{min-width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:14px}.big{font-size:34px}}
</style><header><div><div style="font-size:34px">▥</div><div><h1>BÁO CÁO KẾT QUẢ SALE & KPI</h1><small>OPPO Experience & Service Store An Giang</small></div><div class="actions"><label class="upload">⇧ Tải lên file Excel<input id="files" type="file" accept=".xlsx,.xls" multiple hidden></label> <button onclick="exportReport()">⇩ Xuất Excel</button></div></div></header><nav><div id="nav"></div></nav><main><div id="notice" class="notice"></div><div id="content"></div></main><footer>OPPO An Giang · Xử lý dữ liệu tại trình duyệt · Không gửi dữ liệu đơn hàng lên máy chủ</footer><script>
const groups=['PHONE','TAI NGHE','PAD','ỐP LƯNG','OPPO CARE','MDCL','SDP','WATCH'], labels=['PHONE','TAI NGHE','PAD','ỐP LƯNG','OPPO CARE','MDCL (DÁN CÓ PHÍ)','SẠC DỰ PHÒNG','WATCH (Bubble)'], defaults=[106,12,0,15,32,67,9,0]; let target=defaults.slice(),rules=structuredClone(seed.rules),center=structuredClone(seed.center),service=structuredClone(seed.service),tab=0,query='',msg='Tải lên file Excel để bắt đầu theo dõi KPI.',aliases={};
try{let a=JSON.parse(localStorage.getItem('agconfig')||'null');if(a){target=a.target;rules=a.rules;aliases=a.aliases||{}}}catch(e){}
const norm=x=>String(x??'').normalize('NFC').toLowerCase().replace(/\s+/g,'').replace(/^oppo(?=enco)/,'');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(String(x??0).replace(/,/g,''))||0;const pct=(a,b)=>b? (a/b*100).toFixed(1)+'%':'—';const sum=a=>a.reduce((s,x)=>s+x,0);function save(){try{localStorage.setItem('agconfig',JSON.stringify({target,rules,aliases}))}catch(e){}}
function calculate(){let cr=center.filter(x=>!/^(cáp|cable)|charging cable/i.test(String(x.name))).map(x=>{let valid=norm(x.kind)===norm('Xuất bán')&&norm(x.status)===norm('Hiệu lực');let rule=rules.find(r=>norm(r[0])===norm(aliases[x.name]||x.name)); if(!rule&&norm(x.name).startsWith(norm('Ốp lưng')))rule=rules.find(r=>r[1]==='ỐP LƯNG');return {...x,valid,model:rule?.[0]||'',group:rule?.[1]||'',points:valid&&rule&&groups.includes(rule[1])?num(x.qty)*num(rule[2]):0,note:!valid?'Không hợp lệ':!rule?'Chưa khớp Rule':!groups.includes(rule[1])?'Ngoài nhóm KPI':'Đã tính'}});let sr=service.filter(x=>!/(cáp sạc|charging cable|data cable)/i.test(String(x.name))).map(x=>{let g=({'paidfilm':'MDCL','powerbank':'SDP','warrantyservice':'OPPO CARE'})[norm(x.kind)]||'';let valid=norm(x.status)==='completed'&&g&&(g!=='OPPO CARE'||num(x.amount)>0);let rule=rules.find(r=>r[1]===g);return {...x,group:g,points:valid&&rule?num(x.qty)*num(rule[2]):0,note:valid?'Đã tính':'Không tính'}});let all=[...cr,...sr];return {cr,sr,points:groups.map(g=>sum(all.filter(x=>x.group===g).map(x=>x.points))),unmatched:cr.filter(x=>x.valid&&!x.model)}}
function bar(a,b){return `<div class="bar"><i style="width:${b?Math.min(100,Math.max(0,a/b*100)):0}%"></i></div>`}function setTab(t){tab=t;query='';render()}function table(rows,heads,keys){return `<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.filter(r=>!query||Object.values(r).join(' ').toLowerCase().includes(query.toLowerCase())).map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){let d=calculate(),total=sum(d.points),goal=sum(target);document.querySelector('#notice').textContent=msg;document.querySelector('#nav').innerHTML=['Tổng hợp KPI',`Center SO (${d.cr.filter(x=>x.valid).length})`,`GCSM SO (${d.sr.filter(x=>x.points>0).length})`,'Cấu hình Target & Rule'].map((n,i)=>`<button class="${tab===i?'active':''}" onclick="setTab(${i})">${n}</button>`).join('');let h='';if(tab===0){h=`<div class="flex"><section class="hero"><small>TỔNG ĐIỂM HOÀN THÀNH KPI</small><div class="line"><div><span class="big">${total}</span> / ${goal} điểm</div><div class="score">${pct(total,goal)}</div></div>${bar(total,goal)}<div class="line"><small>Còn thiếu: ${Math.max(0,goal-total)} điểm</small><small>A7 Pro bán ra: ${sum(d.cr.filter(x=>x.valid&&norm(x.name).startsWith('a7pro')).map(x=>num(x.qty)))} máy</small></div></section><section class="panel"><h2>Trạng thái các nhóm KPI</h2><div class="line">Nhóm đạt chỉ tiêu <b class="green">${d.points.filter((p,i)=>target[i]>0&&p>=target[i]).length} / ${target.filter(x=>x>0).length} nhóm</b></div><div class="line">Center SO hợp lệ <b>${d.cr.filter(x=>x.valid).length} dòng</b></div><div class="line">GCSM SO tính điểm <b>${d.sr.filter(x=>x.points>0).length} dòng</b></div><div class="line warn">Chưa khớp Rule <b>${d.unmatched.length} dòng</b></div><button onclick="setTab(3)">⚙ Chỉnh sửa Target / Rule</button></section></div><div class="grid">${groups.map((g,i)=>`<section class="tile"><span class="pct">${pct(d.points[i],target[i])}</span><span class="symbol">${['▯','♫','▣','▱','♧','▯','ϟ','◷'][i]}</span><h3>${labels[i]}</h3><span class="score">${d.points[i]}</span> <small>/ ${target[i]} điểm</small>${bar(d.points[i],target[i])}<small>${target[i]?'Còn thiếu: '+Math.max(0,target[i]-d.points[i])+' điểm':'Không giao chỉ tiêu'}</small></section>`).join('')}</div>`}else if(tab===1||tab===2){let c=tab===1;h=`<section class="panel"><div class="line"><div><h2>Chi tiết đơn hàng ${c?'Center':'GCSM'} SO</h2><small>${c?'Xuất bán – Hiệu lực; tên chưa khớp không tính điểm':'Paid Film, Power bank, Warranty service có thu phí; Completed'}</small></div><input id="search" placeholder="Tìm sản phẩm..." value="${esc(query)}" oninput="query=this.value;updateTable()"></div><div id="detail"></div></section>`}else{h=`<div class="flex"><section class="panel"><h2>Điều chỉnh chỉ tiêu (Target)</h2><div class="line"><b>TỔNG ĐIỂM MỤC TIÊU</b><b id="goal">${goal}</b></div>${labels.map((g,i)=>`<div class="line">${g}<input type="number" min="0" step="1" value="${target[i]}" onchange="target[${i}]=Math.max(0,Math.floor(num(this.value)));save();render()"></div>`).join('')}<button onclick="target=defaults.slice();save();render()">Khôi phục Target</button></section><section class="panel" style="flex:2"><h2>Bảng quy đổi điểm (Rule)</h2><small>Điểm từng sản phẩm có thể điều chỉnh. Lưu tự động.</small><div class="scroll"><table><thead><tr><th>Model / Hạng mục</th><th>Nhóm</th><th>Điểm</th></tr></thead><tbody>${rules.map((r,i)=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><input type="number" min="0" value="${r[2]}" onchange="rules[${i}][2]=Math.max(0,num(this.value));save()"></td></tr>`).join('')}</tbody></table></div></section></div><section class="panel" style="margin-top:20px"><h2>Đối chiếu sản phẩm chưa khớp Rule</h2><small>Chọn model tương ứng nếu đã xác nhận chính sách. Không tự suy đoán.</small>${[...new Set(d.unmatched.map(x=>x.name))].map(n=>`<div class="line"><span>${esc(n)}</span><select data-name="${esc(n)}" onchange="aliases[this.dataset.name]=this.value;save();render()"><option value="">Chưa tính điểm</option>${rules.map(r=>`<option value="${esc(r[0])}">${esc(r[0])}</option>`).join('')}</select></div>`).join('')||'<p>Không còn sản phẩm chưa khớp.</p>'}</section>`}document.querySelector('#content').innerHTML=h;if(tab===1||tab===2)updateTable()}
function updateTable(){let d=calculate();document.querySelector('#detail').innerHTML=tab===1?table(d.cr,['Ngày bán','Tên sản phẩm','Model quy đổi','Số lượng','Loại xuất','Trạng thái','Nhóm','Kiểm tra','Điểm'],['date','name','model','qty','kind','status','group','note','points']):table(d.sr,['Thời gian','Sản phẩm','Phân loại','Số lượng','Thực thu','Trạng thái','Nhóm','Điểm'],['date','name','kind','qty','amount','status','group','points'])}
function classifyRule(n){let k=norm(n);if(k.includes('miếngdán')||k.includes('mdcl'))return 'MDCL';if(k.includes('sạcdựphòng')||k.includes('powerbank'))return 'SDP';if(k.includes('oppocare'))return 'OPPO CARE';if(k.includes('ốplưng'))return 'ỐP LƯNG';if(k.includes('watch')||k.includes('bubble'))return 'WATCH';if(k.includes('enco'))return 'TAI NGHE';if(k.includes('pad'))return 'PAD';if(/^(find|reno|a\d)/.test(k))return 'PHONE';return 'KHÁC'}
document.querySelector('#files').addEventListener('change',async e=>{let reports=[];for(const f of e.target.files){try{if(typeof XLSX==='undefined')throw Error('Không tải được thư viện Excel. Kiểm tra Internet.');let w=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});let found=false;for(const sn of w.SheetNames){let a=XLSX.utils.sheet_to_json(w.Sheets[sn],{header:1,defval:'',raw:false});let hi=a.findIndex(r=>r.includes('Tên sản phẩm')&&r.includes('Loại xuất')&&r.includes('Trạng thái'));if(hi>=0){let h=a[hi],get=(r,k)=>r[h.indexOf(k)];if(!h.includes('Số lượng'))throw Error('Thiếu Số lượng');center=a.slice(hi+1).filter(r=>get(r,'Tên sản phẩm')).map(r=>({date:get(r,'Ngày xuất bán'),name:get(r,'Tên sản phẩm'),qty:get(r,'Số lượng'),kind:get(r,'Loại xuất'),status:get(r,'Trạng thái')}));found=true;reports.push('Center SO: '+center.length+' dòng');continue}hi=a.findIndex(r=>r.includes('Level 3 material classification')&&r.includes('Quantity')&&r.includes('Order status'));if(hi>=0){let h=a[hi],get=(r,k)=>r[h.indexOf(k)];if(!h.includes('Accounts receivable after individual exemptions and reductions'))throw Error('Thiếu cột số tiền OPPO Care');service=a.slice(hi+1).filter(r=>get(r,'Sales Product Name')||get(r,'Level 3 material classification')).map(r=>({date:get(r,'Sales time'),name:get(r,'Sales Product Name'),qty:get(r,'Quantity'),kind:get(r,'Level 3 material classification'),status:get(r,'Order status'),amount:get(r,'Accounts receivable after individual exemptions and reductions')}));found=true;reports.push('GCSM SO: '+service.length+' dòng');continue}hi=a.findIndex(r=>r[0]==='Sản phẩm'&&r[1]==='Điểm');if(hi>=0){let rr=[];for(let r of a.slice(hi+1))for(let i of [0,3])if(r[i]&&r[i+1]!==''&&Number.isFinite(Number(r[i+1])))rr.push([r[i],classifyRule(r[i]),num(r[i+1])]);for(let g of ['MDCL','SDP','OPPO CARE'])if(!rr.some(r=>r[1]===g))rr.push(rules.find(r=>r[1]===g)||[g,g,0]);rules=rr;save();found=true;reports.push('Rule: '+rr.length+' mục')}}if(!found)throw Error('Không nhận diện được định dạng');}catch(err){reports.push(f.name+': '+err.message)}}msg=reports.join(' • ');e.target.value='';render()});
function exportReport(){if(typeof XLSX==='undefined'){alert('Không tải được thư viện Excel. Kiểm tra Internet.');return}let d=calculate(),w=XLSX.utils.book_new();for(let [name,rows] of [['Tổng hợp KPI',groups.map((g,i)=>({'Nhóm':labels[i],'Target':target[i],'Thực hiện':d.points[i],'Tỷ lệ':pct(d.points[i],target[i])}))],['Center SO',d.cr],['GCSM SO',d.sr],['Rule',rules.map(r=>({Model:r[0],Nhóm:r[1],Điểm:r[2]}))]])XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),name);XLSX.writeFile(w,'OPPO_An_Giang_KPI.xlsx')}
render();
</script></html>
